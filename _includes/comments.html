{%- comment -%}
  Disqus comments, loaded only when the reader asks for them, so no Disqus
  cookies are set for readers who don't (see site.js).
{%- endcomment -%}
<div class="comments-gate" data-disqus-gate data-disqus-shortname="zmwolski" data-disqus-url="{{ page.url | absolute_url }}" data-disqus-identifier="{{ page.id }}" hidden>
  <button class="btn btn--outline btn--sm" type="button" data-disqus-load>Show comments</button>
  <p class="meta">Comments are hosted by Disqus, which uses cookies. <a href="/privacy/">Privacy</a></p>
</div>
<div id="disqus_thread"></div>
<noscript><p class="meta">Comments need JavaScript.</p></noscript>
